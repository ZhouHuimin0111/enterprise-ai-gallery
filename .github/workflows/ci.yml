name: Verify gallery
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Unit tests and real MySQL/Redis integration tests
        run: mvn -B -ntp verify
      - name: Validate frontend and compose
        run: |
          node --check frontend/app.js
          node --check scripts/e2e.mjs
          docker compose config -q
      - name: Build tested application image
        run: docker build -f Dockerfile.runtime -t framehub-api:local .
      - name: Start two-instance stack
        run: docker compose up -d --no-build --wait --wait-timeout 240
      - name: Access control, cross-node collaboration and AI restart recovery
        run: |
          npm ci --ignore-scripts
          node scripts/e2e.mjs
          bash scripts/assert-database.sh
      - name: Desktop and mobile browser verification
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
          npm run test:ui
      - name: Collect reports and container logs
        if: always()
        run: |
          mkdir -p test-results
          docker compose logs --no-color > test-results/compose.log 2>&1 || true
          docker compose ps -a > test-results/compose-status.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            test-results/
            playwright-report/
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 14
      - name: Stop temporary CI services
        if: always()
        run: docker compose down
