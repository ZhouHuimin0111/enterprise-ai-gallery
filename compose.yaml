name: framehub
x-api: &api
  image: framehub-api:local
  build: .
  environment: &api-env
    DB_URL: jdbc:mysql://mysql:3306/framehub?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
    DB_USER: framehub
    DB_PASSWORD: ${DB_PASSWORD:-local-demo-password}
    REDIS_HOST: redis
    REDIS_PASSWORD: ${REDIS_PASSWORD:-local-redis-password}
    STORAGE_MODE: ${STORAGE_MODE:-local}
    STORAGE_LOCAL_PATH: /data/objects
    COS_REGION: ${COS_REGION:-}
    COS_BUCKET: ${COS_BUCKET:-}
    COS_SECRET_ID: ${COS_SECRET_ID:-}
    COS_SECRET_KEY: ${COS_SECRET_KEY:-}
    AI_MODE: ${AI_MODE:-demo}
    DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-}
    DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    DASHSCOPE_MODEL: ${DASHSCOPE_MODEL:-wanx2.1-t2i-turbo}
    AI_RESULT_HOSTS: ${AI_RESULT_HOSTS:-dashscope-result-bj.oss-cn-beijing.aliyuncs.com,dashscope-result-sh.oss-cn-shanghai.aliyuncs.com,dashscope-result-sg.oss-ap-southeast-1.aliyuncs.com}
    ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-DemoAdmin2026!}
    DEMO_SEED: ${DEMO_SEED:-true}
    AI_POLL_MS: ${AI_POLL_MS:-10000}
    ENABLE_API_DOCS: ${ENABLE_API_DOCS:-true}
    HIDE_API_DOCS: ${HIDE_API_DOCS:-false}
  volumes: [objects:/data/objects]
  depends_on:
    mysql: {condition: service_healthy}
    redis: {condition: service_healthy}
    object-volume-init: {condition: service_completed_successfully}
  healthcheck:
    test: [CMD-SHELL, 'bash -c "echo > /dev/tcp/localhost/8081"']
    interval: 5s
    timeout: 3s
    retries: 40
    start_period: 30s
  restart: unless-stopped
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: framehub
      MYSQL_USER: framehub
      MYSQL_PASSWORD: ${DB_PASSWORD:-local-demo-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.4-alpine
    environment: {REDIS_PASSWORD: '${REDIS_PASSWORD:-local-redis-password}'}
    command: [sh, -c, 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy noeviction']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
  object-volume-init:
    image: alpine:3.22
    user: '0:0'
    volumes: [objects:/data/objects]
    command: [sh, -c, 'chown 10001:10001 /data/objects']
    restart: 'no'
  api-1:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_ID: api-1
  api-2:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_ID: api-2
  web:
    image: nginx:1.28-alpine
    ports: ['127.0.0.1:8080:80']
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-1: {condition: service_healthy}
      api-2: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1/healthz']
      interval: 5s
      retries: 20
volumes:
  mysql-data:
  redis-data:
  objects:
