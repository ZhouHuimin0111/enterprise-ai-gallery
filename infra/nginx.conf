server {
  listen 80;
  server_tokens off;
  resolver 127.0.0.11 valid=5s ipv6=off;
  root /usr/share/nginx/html;
  client_max_body_size 11m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; connect-src 'self' ws://localhost:8080 ws://127.0.0.1:8080; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  location = /healthz { return 200 'ok'; }
  location /actuator { return 404; }
  location /api/ {
    set $backend api-1;
    if ($request_id ~ "[0-7]$") { set $backend api-2; }
    proxy_pass http://$backend:8081;
    proxy_set_header Host $http_host;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 45s;
  }
  location /ws/ {
    set $backend api-2;
    proxy_pass http://$backend:8081;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_read_timeout 60s;
  }
  location ~ ^/(doc\.html|v3/api-docs|swagger-ui|webjars) {
    set $backend api-1;
    proxy_pass http://$backend:8081;
    proxy_set_header Host $http_host;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; object-src 'none'; frame-ancestors 'none'" always;
  }
  location / { try_files $uri $uri/ /index.html; }
}
