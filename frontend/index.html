<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#183c35"><title>FrameHub · 企业级 AI 图片管理</title><link rel="stylesheet" href="/styles.css"><script src="/app.js" defer></script></head>
<body>
  <aside class="sidebar">
    <a class="brand" href="/" aria-label="FrameHub 首页"><span class="brand-mark">F<span>·</span></span><span>FrameHub<small>让灵感，有处可寻</small></span></a>
    <p class="nav-label">工作台 / WORKSPACE</p>
    <nav aria-label="图库导航">
      <button data-nav="public" class="active"><span class="nav-icon">▧</span>公共图库<span class="nav-arrow">↗</span></button>
      <button data-nav="private"><span class="nav-icon">▣</span>私有图库</button>
      <button data-nav="team"><span class="nav-icon">◈</span>团队空间</button>
      <button data-nav="ai"><span class="nav-icon">✧</span>AI 创作室<span class="tiny-badge">AI</span></button>
      <button data-nav="analytics"><span class="nav-icon">▥</span>空间分析</button>
      <button data-nav="admin" class="hidden" id="admin-nav"><span class="nav-icon">✓</span>审核管理</button>
    </nav>
    <div class="sidebar-bottom"><div class="mini-art">✦<span>每一个创意<br>都值得被珍藏。</span></div><p id="mode-label">正在连接图库…</p><small>FrameHub · 2026</small></div>
  </aside>
  <div class="main-shell">
    <header class="topbar"><div class="breadcrumb">工作台 <span>/</span> <strong id="breadcrumb">公共图库</strong></div><div class="top-actions"><button id="profile-button" class="text-button hidden">账号设置</button><button id="accept-invite" class="text-button">加入团队</button><button id="auth-button" class="avatar-button">登录 / 注册</button></div></header>
    <main id="main" tabindex="-1">
      <section class="hero"><div><p class="eyebrow">A HOME FOR YOUR VISUAL IDEAS</p><h1 id="page-title">收集灵感，<br>创造更多可能<span>。</span></h1><p id="page-description">探索、收藏与共享视觉素材，让团队创作从这里开始。</p><div class="hero-actions"><button id="primary-action" class="button primary">＋ 上传图片</button><button id="secondary-action" class="button secondary">✧ 开始 AI 创作</button></div></div><div class="hero-art" aria-hidden="true"><span class="art-circle"></span><span class="art-frame one"></span><span class="art-frame two"></span><span class="art-star">✳</span><span class="art-caption">SEE. SAVE. CREATE.</span></div></section>
      <div id="space-panel" class="hidden"></div>
      <section id="gallery-section">
        <div class="section-heading"><div><p class="eyebrow">CURATED GALLERY</p><h2 id="gallery-title">发现你的下一份灵感</h2></div><span id="picture-count" class="muted">加载中</span></div>
        <form id="search-form" class="filters"><label class="search-box"><span>⌕</span><input id="search" name="q" placeholder="搜索图片名称…" maxlength="100" aria-label="搜索图片"></label><select id="category-filter" aria-label="分类"><option value="">所有分类</option><option>品牌</option><option>空间</option><option>插画</option><option>产品</option><option>创意</option><option>AI</option></select><input id="tag-filter" placeholder="标签" maxlength="30" aria-label="标签筛选"><select id="sort-filter" aria-label="排序"><option value="newest">最新上传</option><option value="oldest">最早上传</option><option value="largest">文件大小</option></select><button class="button small" type="submit">检索</button><label id="mine-label" class="check-label"><input id="mine-filter" type="checkbox">我的上传</label></form>
        <div id="batch-bar" class="batch-bar hidden"><strong id="selected-count"></strong><button id="batch-edit" class="text-button">批量分类 / 标签</button><button id="batch-delete" class="text-button danger">批量删除</button><button id="batch-clear" class="text-button">取消选择</button></div>
        <div id="gallery" class="gallery-grid" aria-live="polite"></div>
        <div class="pagination"><button id="previous-page" class="button secondary small">上一页</button><span id="page-indicator">1</span><button id="next-page" class="button secondary small">下一页</button></div>
      </section>
      <section id="extra-section" class="hidden"></section>
      <footer>把图片管理好，把时间留给创作。<span>FRAMEHUB / VISUAL WORKSPACE</span></footer>
    </main>
  </div>
  <dialog id="modal"><div class="modal-header"><h2 id="modal-title"></h2><button id="close-modal" class="icon-button" aria-label="关闭">×</button></div><div id="modal-body"></div></dialog>
  <div id="toast" role="status" class="toast hidden"></div>
</body></html>
